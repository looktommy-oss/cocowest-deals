Name: Update CocoWest New Deals

on:
  schedule:
    # GitHub Actions uses UTC.
    # BC is permanently on Pacific Time (UTC-7) year-round.
    #
    # Monday: 4:00pm, 4:30pm, 5:00pm, 5:30pm, 6:00pm, 8:00pm
    # = Monday UTC 23:00, 23:30, Tuesday UTC 00:00, 00:30, 01:00, 03:00
    - cron: '0,30 23 * * 1'
    - cron: '0,30 0 * * 2'
    - cron: '0 1,3 * * 2'

    # Tuesday: 1:00pm, 2:00pm, 4:00pm, 4:30pm, 5:00pm, 5:30pm, 6:00pm, 8:00pm
    # = Tuesday UTC 20:00, 21:00, 23:00, 23:30, Wednesday UTC 00:00, 00:30, 01:00, 03:00
    - cron: '0 20,21,23 * * 2'
    - cron: '30 23 * * 2'
    - cron: '0,30 0 * * 3'
    - cron: '0 1,3 * * 3'

    # Friday: 2:00pm, 4:00pm, 7:00pm
    # = Friday UTC 21:00, 23:00, Saturday UTC 02:00
    - cron: '0 21,23 * * 5'

    # Friday 5:30pm = Saturday UTC 00:30
    - cron: '30 0 * * 6'

    # Saturday Fallbacks: 10:00am, 2:00pm = Saturday UTC 17:00, 21:00
    - cron: '0 2,17,21 * * 6'

  workflow_dispatch:
    inputs:
      force_notify:
        description: "Send the email even if this weekend post was already announced"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install cloudscraper beautifulsoup4

      - name: Run scraper script
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          FORCE_NOTIFY: ${{ inputs.force_notify && '1' || '0' }}
        run: python -u script.py

      - name: Verify output exists
        run: |
          if [ ! -f public/index.html ]; then
            echo "ERROR: public/index.html was not created by script.py"
            echo "Files in repo root:"
            ls -la
            echo "Last lines of script.py:"
            tail -n 5 script.py
            exit 1
          fi
          ls -la public

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
          
