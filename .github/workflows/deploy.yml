name: Update CocoWest New Deals

on:
  schedule:
    # GitHub cron is UTC only, and BC switches between PDT (UTC-7) and PST (UTC-8).
    # These slots are deliberately a little wider than the real windows so they
    # work all year with no edits. script.py checks Vancouver time and exits
    # instantly (no request to CocoWest) outside the windows below.
    #
    # Monday post  : Mon 3pm-9pm, then Tue and Wed 8am-9am and 3pm-9pm, every 30 min
    # Weekend post : Fri 1pm-9pm, then Sat 8am-9am and 3pm-9pm, every 30 min
    # Each hunt stops as soon as that week's post is captured.

    # Evening windows, first part (Mon, Tue, Wed, Sat), UTC 22:00-23:30
    - cron: '0,30 22,23 * * 1,2,3,6'
    # Evening windows, after UTC midnight (Tue, Wed, Thu, Sat, Sun), UTC 00:00-05:00
    - cron: '0,30 0-4 * * 0,2,3,4,6'
    - cron: '0 5 * * 0,2,3,4,6'
    # Morning windows (Tue, Wed, Sat), UTC 15:00-17:00
    - cron: '0,30 15,16 * * 2,3,6'
    - cron: '0 17 * * 2,3,6'
    # Friday afternoon/evening start, UTC 20:00-23:30
    - cron: '0,30 20-23 * * 5'

  workflow_dispatch:
    inputs:
      force_notify:
        description: "Send the email even if this weekend post was already announced"
        type: boolean
        default: false

permissions:
  contents: write

# Never let two runs overlap (they would both write to gh-pages).
concurrency:
  group: cocowest-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Read last run's state.json straight from the gh-pages branch: exact, and
      # not subject to GitHub Pages caching delays. Fine if the branch doesn't exist yet.
      - name: Load previous state
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: prev-site

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install cloudscraper beautifulsoup4

      - name: Run scraper script
        id: scrape
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          FORCE_NOTIFY: ${{ inputs.force_notify && '1' || '0' }}
          STATE_FILE: prev-site/state.json
        run: python -u script.py

      # script.py writes deploy=true only when it captured a new post (or on a
      # manual run). Idle and "not posted yet" runs stop here.
      - name: Verify output exists
        if: steps.scrape.outputs.deploy == 'true'
        run: |
          if [ ! -f public/index.html ]; then
            echo "ERROR: public/index.html was not created by script.py"
            echo "Files in repo root:"
            ls -la
            exit 1
          fi
          ls -la public

      - name: Deploy to GitHub Pages
        if: steps.scrape.outputs.deploy == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
